<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXTGEN AI CREATOR</title>

<style>
body {
  margin: 0;
  padding: 20px;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
}
h1 { color: #38d9ff; }
.box {
  background: #1e293b;
  padding: 16px;
  border-radius: 12px;
  margin-bottom: 15px;
}
textarea, input, button {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
}
button {
  background: #08a6d9;
  color: white;
  font-weight: bold;
}
#result {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<h1>🚀 NEXTGEN AI CREATOR</h1>
<p>Your AI Engineering Assistant</p>

<div class="box">
<h2>🤖 AI Chat</h2>
<textarea id="message" placeholder="Ask NEXTGEN AI..."></textarea>
<button onclick="sendChat()">Send Message</button>
</div>

<div class="box">
<h2>🖼️ AI Image Analysis</h2>
<input type="file" id="image" accept="image/*">
<textarea id="prompt">Describe and analyze this image.</textarea>
<button onclick="analyzeImage()">Analyze Image</button>
</div>

<div class="box">
<h2>📁 AI File Analysis</h2>
<p>Upload PDF, DOCX, XLSX or TXT files.</p>
<input type="file" id="document"
accept=".pdf,.docx,.xlsx,.txt">
<button onclick="analyzeFile()">Analyze File</button>
</div>

<div class="box">
<h2>📄 AI Response</h2>
<div id="result">Welcome to NEXTGEN AI CREATOR!</div>
</div>

<script>
const API = "https://nextgen-ai-engineering.onrender.com";

async function sendChat() {
  const message = document.getElementById("message").value;
  const result = document.getElementById("result");

  if (!message.trim()) {
    result.textContent = "Please enter a message.";
    return;
  }

  result.textContent = "AI is thinking...";

  try {
    const response = await fetch(API + "/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message})
    });

    const data = await response.json();
    if (!response.ok) throw new Error(JSON.stringify(data));

    result.textContent = data.reply || JSON.stringify(data);
  } catch (error) {
    result.textContent = "Error: " + error.message;
  }
}

async function analyzeImage() {
  const file = document.getElementById("image").files[0];
  const prompt = document.getElementById("prompt").value;
  const result = document.getElementById("result");

  if (!file) {
    result.textContent = "Please choose an image first.";
    return;
  }

  result.textContent = "Analyzing image...";

  const form = new FormData();
  form.append("image", file);
  form.append("prompt", prompt);

  try {
    const response = await fetch(API + "/api/analyze-image", {
      method: "POST",
      body: form
    });

    const data = await response.json();
    if (!response.ok) throw new Error(JSON.stringify(data));

    result.textContent = data.reply || JSON.stringify(data);
  } catch (error) {
    result.textContent = "Error: " + error.message;
  }
}

async function analyzeFile() {
  const file = document.getElementById("document").files[0];
  const result = document.getElementById("result");

  if (!file) {
    result.textContent = "Please choose a file first.";
    return;
  }

  if (file.size > 10 * 1024 * 1024) {
    result.textContent = "File is too large. Maximum size is 10 MB.";
    return;
  }

  result.textContent = "Analyzing file... Please wait.";

  const form = new FormData();
  form.append("file", file);

  try {
    const response = await fetch(API + "/api/analyze-file", {
      method: "POST",
      body: form
    });

    const data = await response.json();
    if (!response.ok) throw new Error(JSON.stringify(data));

    result.textContent = data.reply || JSON.stringify(data);
  } catch (error) {
    result.textContent = "File analysis error: " + error.message;
  }
}
</script>

</body>
</html>
